# 서울시 시영주차장 실시간 주차대수를 10분마다 수집해 `data` 브랜치에 커밋한다.
# main 브랜치 기록이 수천 개의 데이터 커밋으로 덮이지 않도록 데이터는 별도 브랜치에 둔다.
#
# 준비: 저장소 Settings > Secrets and variables > Actions 에 SEOUL_API_KEY 등록
# 점검: Actions 탭에서 수동 실행(Run workflow) 시 "sample 키로 접속만 확인"을 켜면
#       인증키 없이 GitHub 서버에서 API에 닿는지만 확인하고 아무것도 커밋하지 않는다.

name: collect-parking

on:
  schedule:
    # 정각은 GitHub 예약 실행이 몰려 지연·누락이 잦아서 3분씩 비켜 둔다 (UTC 기준이지만 10분 간격이라 무관)
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "sample 키로 접속만 확인 (커밋하지 않음)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-parking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Connectivity check with sample key
        if: ${{ inputs.sample }}
        run: python src/collect.py --sample --dry-run

      - name: Prepare data branch worktree
        if: ${{ !inputs.sample }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach store FETCH_HEAD
          else
            # 첫 실행: 빈 data 브랜치를 만든다
            git worktree add --detach store
            git -C store checkout --orphan data
            git -C store rm -rfq .
          fi

      - name: Collect
        if: ${{ !inputs.sample }}
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python src/collect.py --out-dir store

      - name: Commit and push
        if: ${{ !inputs.sample }}
        working-directory: store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -q -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git push origin HEAD:refs/heads/data
